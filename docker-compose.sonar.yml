# ==============================================================================
# SONARQUBE LOCAL SETUP INSTRUCTIONS
# ==============================================================================
#
# STEP 1: START THE SERVER
# Run this command in your terminal:
# docker compose -f docker-compose.sonar.yml up -d
#
# Wait ~2 minutes, then open http://localhost:9000
# Log in with credentials: admin / admin (you will be prompted to change it)
# Go to Create Project > Manually.
# Name it "laravel-livewire-project" and generate a user token.
#
# STEP 2: RUN THE SCANNER
# Copy the appropriate command for your OS and replace <YOUR_TOKEN>
# with the token you generated in Step 1.
#
# --- MAC / LINUX (Zsh/Bash) ---
# docker run --rm \
#     --network laravel-sonar-network \
#     -v "$(pwd):/usr/src" \
#     sonarsource/sonar-scanner-cli \
#     -Dsonar.projectKey="laravel-livewire-project" \
#     -Dsonar.sources="." \
#     -Dsonar.host.url="http://sonarqube:9000" \
#     -Dsonar.login="<YOUR_TOKEN>" \
#     -Dsonar.exclusions="vendor/**,node_modules/**,storage/**,public/**" \
#     -Dsonar.php.file.suffixes="php,inc,module"
#
# --- WINDOWS (PowerShell) ---
# docker run --rm `
#     --network laravel-sonar-network `
#     -v "${PWD}:/usr/src" `
#     sonarsource/sonar-scanner-cli `
#     -Dsonar.projectKey="laravel-livewire-project" `
#     -Dsonar.sources="." `
#     -Dsonar.host.url="http://sonarqube:9000" `
#     -Dsonar.login="<YOUR_TOKEN>" `
#     -Dsonar.exclusions="vendor/**,node_modules/**,storage/**,public/**" `
#     -Dsonar.php.file.suffixes="php,inc,module"
#
# --- WINDOWS (Command Prompt / CMD) ---
# docker run --rm ^
#     --network laravel-sonar-network ^
#     -v "%cd%:/usr/src" ^
#     sonarsource/sonar-scanner-cli ^
#     -Dsonar.projectKey="laravel-livewire-project" ^
#     -Dsonar.sources="." ^
#     -Dsonar.host.url="http://sonarqube:9000" ^
#     -Dsonar.login="<YOUR_TOKEN>" ^
#     -Dsonar.exclusions="vendor/**,node_modules/**,storage/**,public/**" ^
#     -Dsonar.php.file.suffixes="php,inc,module"
#
# ==============================================================================

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: always
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - sonar-net

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:

networks:
  sonar-net:
    name: laravel-sonar-network
    driver: bridge
